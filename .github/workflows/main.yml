# CI — runs the automated test suites on every pull request, and on main.
#
# Two of the three apps in the repo are tested here:
#   frontend — Vitest (React Testing Library).
#   mobile   — Jest + React Native Testing Library (the Expo app).
#
# The backend (Django) suite is NOT here — it lives in backend.yml so it can be
# path-filtered to backend-only changes. It takes ~20 minutes against every
# other job's ~1, and it can't see frontend/ or mobile/ code, so running it on a
# frontend PR only made the PR wait. Read backend.yml's header before changing
# that arrangement — its skipping is why it isn't a required check.
#
# Also here: "deploy-scripts", fast shell-level tests of the box's own scripts —
# the autodeploy decision (issue #104), the backup preconditions and the restore
# preflight (issue #197), all with no Docker daemon involved; and
# "backend-image", which builds the production backend image and checks it boots
# unprivileged (issue #199), the one thing no other job covers.
#
# The job names here ("frontend", "mobile", "semgrep") plus CodeQL's "Analyze
# (…)" jobs are the required status checks for branch protection on main — all
# must pass before a PR can merge.
#
# "deploy-scripts" and "backend-image" are NOT yet in that branch-protection
# list. Both run unfiltered on every PR, so unlike "backend" (see backend.yml)
# there's no skipped-check hazard in requiring them; add them when convenient:
#
#   gh api repos/Sam-GitHuber/TimeLine/branches/main/protection/required_status_checks \
#     -X PATCH -f 'contexts[]=frontend' -f 'contexts[]=mobile' \
#     -f 'contexts[]=semgrep' -f 'contexts[]=deploy-scripts' \
#     -f 'contexts[]=backend-image' \
#     -f 'contexts[]=Analyze (javascript-typescript)' -f 'contexts[]=Analyze (python)'
#
# WHY THE TRIGGERS LOOK LIKE THIS
# -------------------------------
# This was `on: [push, pull_request]`, which double-ran everything. A branch in
# this repo (including Dependabot's) fires BOTH events for the same commit — a
# `push` on the branch and a `pull_request` on the PR — so every job below ran
# twice on every PR, for identical code, at double the Actions minutes. You could
# see it in the checks list: two "frontend", two "mobile", two "semgrep", every
# time.
#
# Restricting `push` to main keeps the two runs we actually want — the PR run
# (which is what branch protection gates on) and a post-merge run on main — and
# drops the redundant one. codeql.yml already scopes its triggers this way; this
# just brings CI into line with it.
#
# Trade: pushing a branch with no PR open no longer runs CI. Open the PR (draft
# is enough) and it runs. That's the same deal CodeQL has always had here.
#
# NOTE: backend.yml still has an unfiltered `push:`, so it keeps double-running
# on backend PRs — and at ~20 minutes a go that's the expensive one. Left alone
# deliberately; its path filter interacts with branch updates (see its header).
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (eslint)
        run: npm run lint

      - name: Run tests
        run: npm test

  # mobile — the Expo (React Native) iOS/Android app. Jest + React Native
  # Testing Library, unit and component tests only.
  #
  # `npm test` runs the whole suite **twice, once per platform** (Phase 10; see
  # mobile/jest.config.js), so a suite count of ~82 for ~41 files is expected.
  # That is what covers the app's `Platform.OS === 'android'` branches — before
  # it, they were never executed by CI on any run.
  #
  # This job deliberately does NOT build an app binary. Real iOS/Android builds
  # happen on EAS (Expo's cloud build service), which needs signing credentials
  # and a macOS runner — don't try to produce an IPA here.
  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (eslint)
        run: npx expo lint

      # The app is TypeScript (the web frontend is not), so a type error is a
      # real build failure here — worth catching before the tests run.
      - name: Typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm test

  # deploy-scripts — the box's shell scripts. Each suite covers the decision a
  # script gets to make, not the work it does: autodeploy's redeploy decision
  # (the piece that silently stopped deploying for six days, issue #104),
  # backup's preconditions, and restore's preflight (the checks that must happen
  # *before* it stops the app and overwrites the database, issue #197). All are
  # pure logic around a handful of `docker`/`rclone` calls, so sourcing the real
  # script — with a stub `docker` on PATH where one is needed — tests them
  # properly with no daemon, no Postgres and no R2 here.
  # Seconds to run — no Docker, no services, no install step.
  deploy-scripts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Test the autodeploy redeploy decision
        run: ./deploy/tests/test_autodeploy.sh

      - name: Test the backup preconditions
        run: ./deploy/tests/test_backup_guards.sh

      - name: Test the restore preflight
        run: ./deploy/tests/test_restore_preflight.sh

  # backend-image — builds the production backend image and proves it starts the
  # way it's supposed to. Nothing else in CI does: the image is otherwise built
  # only by release-deploy.yml, straight to GHCR, from where the box pulls it —
  # so a break in the user creation or the privilege drop (issue #199) would
  # first show up as a crash-looping backend on the live site, and the release
  # workflow would go green while it happened. The failure modes are real if
  # unlikely: a future base image taking uid 1000, or dropping setpriv.
  # ~1 min; no database needed, because the entrypoint drops privileges before
  # it ever waits for Postgres.
  backend-image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Build the production backend image
        run: docker build -t timeline-backend:ci ./backend

      - name: The app user exists, and cannot rewrite the code it runs
        run: |
          test "$(docker run --rm timeline-backend:ci id -u app)" = "1000"
          # /app stays root-owned on purpose — the half of #199 about a
          # compromise editing the application in place.
          docker run --rm -u app timeline-backend:ci \
            sh -c 'if touch /app/pwned 2>/dev/null; then echo "app user can write /app"; exit 1; fi'
          # ...but it must own the two directories it actually writes to.
          docker run --rm -u app timeline-backend:ci \
            sh -c 'touch /app/media/probe /app/staticfiles/probe'

      - name: The prod entrypoint drops privileges and repairs media ownership
        run: |
          docker volume create ci-media
          # Seed the volume the way the real box's media tree was: root-owned.
          docker run --rm -v ci-media:/m timeline-backend:ci \
            sh -c 'mkdir -p /m/posts && echo x > /m/posts/photo.jpg && chown -R 0:0 /m'
          # No reachable Postgres, so it parks in the wait loop — which is AFTER
          # the drop, so 20s is plenty to see whether it happened.
          docker run --rm -v ci-media:/app/media -e POSTGRES_HOST=nowhere.invalid \
            timeline-backend:ci bash -c 'timeout 20 bash /app/entrypoint.prod.sh' >boot.log 2>&1 || true
          cat boot.log
          grep -q 'Running as app (uid 1000).' boot.log
          test "$(docker run --rm -v ci-media:/m timeline-backend:ci stat -c %u /m/posts/photo.jpg)" = "1000"

      - name: The push drain starts unprivileged and survives a dead database
        run: |
          # The `pushes` service (issue #354) runs this image with a different
          # command and NO entrypoint.prod.sh — so it gets neither that script's
          # privilege drop nor its HOME export, and docker-compose.prod.yml
          # supplies both by hand instead. Nothing else in CI exercises that
          # combination, and its failure mode is the quiet one: the site stays
          # up, healthz stays green, and nobody's phone ever buzzes again.
          #
          # No reachable Postgres on purpose. A resident drain that exits on a
          # transient database fault is worse than the timer it replaced, which
          # at least got a fresh process the next minute — so "logged it and
          # kept going" is the behaviour to pin, not an incidental detail.
          docker run --rm -u app -e HOME=/home/app -e DJANGO_DEBUG=true \
            -e POSTGRES_HOST=nowhere.invalid timeline-backend:ci \
            bash -c 'timeout 25 python manage.py send_pushes --loop --interval 1' \
            >drain.log 2>&1 || true
          cat drain.log
          grep -q 'Draining every' drain.log
          # Twice, not once: one line would also be printed by a loop that then
          # died, which is the thing being ruled out.
          test "$(grep -c 'Drain failed' drain.log)" -ge 2

  # Semgrep — framework-aware static analysis (Django/React/JS/Python + secret
  # detection). Complements CodeQL (see codeql.yml) with rules CodeQL doesn't
  # ship. Its own job so a finding here is easy to tell apart from a test
  # failure; a required check for branch protection on main.
  semgrep:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Semgrep
        # Pin the version: an unpinned install is at the mercy of whatever landed
        # on PyPI. semgrep 1.170.0 shipped without a prebuilt manylinux wheel, so
        # pip built it from the sdist — which omits the compiled `semgrep-core`
        # binary — and every run died with "Failed to find semgrep-core". 1.169.0
        # ships the working wheel; bump deliberately once a later release is known
        # good.
        run: pip install semgrep==1.169.0

      - name: Run Semgrep
        run: >-
          semgrep scan --error --metrics off
          --config p/python --config p/django
          --config p/javascript --config p/react --config p/secrets
          --exclude migrations --exclude node_modules
          --exclude dist --exclude .venv
          backend frontend/src mobile/src
